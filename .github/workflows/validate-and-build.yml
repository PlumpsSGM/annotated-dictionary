name: Validate and build dictionary

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictionary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dictionary-checks:
    name: Dictionary checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate internal links
        run: python3 scripts/validate_dictionary.py

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_dict.tex
          compiler: latexmk
          args: >-
            -pdf
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode

      - name: Name compiled PDF
        shell: bash
        run: mv -- 00_dict.pdf "Annotated Dictionary.pdf"

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: Annotated Dictionary
          path: Annotated Dictionary.pdf
          if-no-files-found: error
          retention-days: 30
