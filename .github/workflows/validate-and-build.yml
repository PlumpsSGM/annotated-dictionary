name: Validate and build dictionary

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictionary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dictionary-checks:
    name: Dictionary checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate internal links
        run: python3 scripts/validate_dictionary.py

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 00_dict.tex
          compiler: latexmk
          args: >-
            -pdf
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode

      - name: Name compiled PDF
        id: pdf
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          safe_branch="$(printf '%s' "$BRANCH_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')"
          short_commit="${COMMIT_SHA:0:12}"
          basename="${timestamp}_${safe_branch}_${short_commit}_AnnotatedDictionary"
          filename="${basename}.pdf"
          mv -- 00_dict.pdf "$filename"
          echo "basename=$basename" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pdf.outputs.basename }}
          path: ${{ steps.pdf.outputs.filename }}
          if-no-files-found: error
          retention-days: 30
